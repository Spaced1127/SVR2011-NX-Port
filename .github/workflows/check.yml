name: check

on:
  push:
  pull_request:

jobs:
  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Release guard (no game data)
        run: python tools/check_no_game_data.py
      - name: Python syntax
        run: python -m py_compile tools/*.py
      - name: Shell syntax
        run: bash -n tools/*.sh
